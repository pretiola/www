# Candidate production configuration: do not deploy before docs/operations.md gates pass.
app = 'pretiola-website'
primary_region = 'yyz'

[build]

[env]
  APP_ENV = 'production'
  PUBLIC_ORIGIN = 'https://pretiola.org'
  INTAKE_DB = '/data/pretiola/intake.sqlite3'
  MAIL_MODE = 'smtp'
  TRUST_FLY_PROXY = 'true'
  # PERSISTENT_STORAGE_CONFIRMED must be set only after mount/restore verification.

[[mounts]]
  source = 'intake_data'
  destination = '/data'
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
