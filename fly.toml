# Production: one SQLite writer on the verified intake_data volume.
app = 'pretiola-website'
primary_region = 'yyz'

[build]

[env]
  APP_ENV = 'production'
  PUBLIC_ORIGIN = 'https://pretiola.org'
  INTAKE_DB = '/data/pretiola/intake.sqlite3'
  NOTIFICATION_MODE = 'telegram'
  TRUST_FLY_PROXY = 'true'
  PERSISTENT_STORAGE_CONFIRMED = 'true'

[[mounts]]
  source = 'intake_data'
  destination = '/data'
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '15s'
  method = 'GET'
  path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
