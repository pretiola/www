<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }} | Pretiola{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ description }}{% endblock description %}">
  {% if local_preview or page_name == 'received' %}<meta name="robots" content="noindex, nofollow">{% else %}<link rel="canonical" href="{{ canonical }}">{% endif %}
  <meta property="og:title" content="Pretiola | Practical expertise in service of charitable missions">
  <meta property="og:description" content="An independent initiative rooted in Catholic faith. Practical skills, shared learning and locally led charitable work.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ canonical }}">
  <link rel="icon" href="/static/favicon.ico">
  <link href="/static/css/tailwind.css?v=20260920-piglet-mono" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% if local_preview %}<div class="preview-note">Local review · Draft content · Please use fictional details when testing forms</div>{% endif %}
  {% include "navbar.html" %}
  <main id="main">{% block content %}{% endblock content %}</main>
  {% include "footer.html" %}
</body>
</html>
